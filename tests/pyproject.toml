[project]
name = "build-megablocks-gpu-tests"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grouped-gemm==0.3.0+cu.12.8.torch.2.7",
    "megablocks==0.10.0+cu.12.8.torch.2.7",
    "numpy>=1.24,<3",
    "pytest>=8,<10",
    "torch==2.7.1+cu128",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
megablocks = { index = "astral-cu128" }
grouped-gemm = { index = "astral-cu128" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "astral-cu128"
url = "https://wheels.astral.sh/simple/cu128/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
